services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://roc_gms:roc_gms_password@postgres:5432/roc_gms
      # Local-only demo default. Production must supply PAYLOAD_SECRET and DATABASE_URL.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_ADMIN_AUTOLOGIN: ${PAYLOAD_ADMIN_AUTOLOGIN:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@roc-gms.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roc_gms
      POSTGRES_USER: roc_gms
      POSTGRES_PASSWORD: roc_gms_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roc_gms -d roc_gms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  app_node_modules:
  postgres_data:
  redis_data:
